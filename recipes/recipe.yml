---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: dos
description: DOS — Custom Fedora Atomic image for Acer Nitro 5 with Hyprland and Noctalia

base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: akmods
    install: []
    nvidia-driver: nvidia

  - type: dnf
    repos:
      copr:
        - atim/starship
        - scottames/ghostty
        - ashbuk/Hyprland-Fedora
    install:
      packages:
        # Desktop & Wayland Compositor
        - hyprland
        - xdg-desktop-portal-hyprland
        - ghostty
        - noctalia
        - wl-clipboard
        - grim
        - slurp
        - brightnessctl
        - greetd
        - greetd-selinux
        - tuigreet

        # Input Framework: Fcitx5 + Mozc (IBus excluded)
        - fcitx5
        - fcitx5-mozc
        - fcitx5-gtk
        - fcitx5-qt
        - fcitx5-configtool

        # CLI Utilities
        - git
        - curl
        - wget
        - ripgrep
        - fd-find
        - fzf
        - jq
        - yq
        - bat
        - btop
        - tmux
        - zoxide
        - mpv
        - starship

        # Development
        - neovim
        - podman
        - distrobox

        # Android Tools
        - android-tools

        # System & Hardware Power Management
        - power-profiles-daemon

  - type: script
    scripts:
      - install-tools.sh

  - type: systemd
    system:
      enable:
        - greetd
        - power-profiles-daemon

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
      - scope: user

  - type: signing
