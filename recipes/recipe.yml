---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: dos
description: DOS — Custom Fedora Atomic image for Acer Nitro 5 with Umbriel and Noctalia

base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    remove:
      auto-remove: false
      packages:
        - ibus
        - ibus-libs
        - ibus-gtk
        - ibus-chewing
    install:
      exclude:
        - ibus
        - ibus-libs
        - ibus-gtk*
        - ibus-chewing*
      packages:
        # Desktop & Wayland Compositor: Umbriel + Noctalia
        # (xdg-desktop-portal-umbriel-nightly and xwayland-satellite are auto-resolved as Requires of umbriel-nightly)
        - umbriel-nightly
        - xdg-desktop-portal-gtk
        - ghostty
        - noctalia
        - wl-clipboard
        - grim
        - slurp
        - brightnessctl
        - greetd
        - greetd-selinux
        - tuigreet

        # Input Framework: Fcitx5 + Mozc (IBus excluded)
        - fcitx5
        - fcitx5-mozc
        - fcitx5-gtk
        - fcitx5-qt
        - fcitx5-configtool

        # CLI Utilities
        - git
        - curl
        - wget
        - ripgrep
        - fd-find
        - fzf
        - jq
        - yq
        - bat
        - btop
        - tmux
        - zoxide
        - mpv
        - starship

        # Development
        - neovim
        - podman
        - distrobox

        # Android Tools
        - android-tools

        # System & Hardware Power Management
        - power-profiles-daemon

  - type: script
    scripts:
      - install-tools.sh

  - type: systemd
    system:
      enable:
        - greetd
        - power-profiles-daemon

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
      - scope: user

  - type: signing
